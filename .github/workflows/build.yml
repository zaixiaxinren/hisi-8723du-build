name: Build 8723du for Hi3798MV200H (3.18.24)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc flex bison libssl-dev \
            gcc-arm-linux-gnueabihf xz-utils cpio rsync
          echo "--- cross gcc ---"
          arm-linux-gnueabihf-gcc --version | head -2

      - name: Fetch Linux 3.18.24
        run: |
          if [ ! -f linux-3.18.24.tar.xz ]; then
            wget -q https://cdn.kernel.org/pub/linux/kernel/v3.x/linux-3.18.24.tar.xz
          fi
          tar xf linux-3.18.24.tar.xz
          echo "kernel tree ready"

      - name: Patch kernel for modern gcc
        run: |
          cd linux-3.18.24
          echo "--- 3.18 only ships compiler-gcc{3,4,5}.h, add aliases for newer gcc ---"
          for v in 6 7 8 9 10 11 12 13; do
            printf '#include <linux/compiler-gcc5.h>\n' > include/linux/compiler-gcc${v}.h
          done
          ls -1 include/linux/compiler-gcc*.h
          echo "--- gcc 10+ defaults to -fno-common, breaks dtc yylloc; restore -fcommon for host tools ---"
          sed -i 's/^HOSTCFLAGS\(.*\)= -Wall/HOSTCFLAGS\1= -fcommon -Wall/' Makefile
          grep -n "^HOSTCFLAGS" Makefile | head -3

      - name: Configure kernel to match target vermagic
        run: |
          cd linux-3.18.24
          echo "--- base config: vexpress (single-platform ARMv7, selects CPU_V7) ---"
          make ARCH=arm vexpress_defconfig
          ./scripts/config --file .config \
            --enable  SMP \
            --disable PREEMPT \
            --enable  PREEMPT_NONE \
            --disable THUMB2_KERNEL \
            --enable  MODULE_UNLOAD \
            --disable MODVERSIONS \
            --enable  ARM_PATCH_PHYS_VIRT \
            --set-str LOCALVERSION "_hi3798mv2x" \
            --enable  CFG80211 \
            --enable  WIRELESS \
            --enable  RFKILL
          make ARCH=arm olddefconfig
          echo "=== CPU / march relevant ==="
          grep -E "^CONFIG_(CPU_V7|CPU_32v7|ARCH_MULTI_V7|ARCH_VEXPRESS|ARM_PATCH_PHYS_VIRT|AEABI|SMP|THUMB2_KERNEL|PREEMPT|PREEMPT_NONE)=" .config || true
          grep -E "^# CONFIG_(THUMB2_KERNEL|PREEMPT|MODVERSIONS|CPU_V7) is not set" .config || true
          echo "=== other ==="
          grep -E "^CONFIG_(MODULE_UNLOAD|MODULES|CFG80211|WIRELESS|RFKILL)=" .config || true
          grep -E "^CONFIG_LOCALVERSION" .config || true

      - name: modules_prepare
        run: |
          cd linux-3.18.24
          echo "=== make prepare (generates include/generated/bounds.h) ==="
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- prepare -j$(nproc) 2>&1 | tail -25
          echo "=== make modules_prepare ==="
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules_prepare -j$(nproc) 2>&1 | tail -25
          echo "=== verify generated headers ==="
          ls -l include/generated/ | head -25
          echo "--- critical files ---"
          for f in include/generated/autoconf.h include/generated/utsrelease.h include/generated/bounds.h; do
            if [ -f "$f" ]; then echo "  OK   $f"; else echo "  MISS $f"; fi
          done
          cat include/generated/utsrelease.h 2>/dev/null || true

      - name: Build 8723du module
        id: build
        continue-on-error: true
        run: |
          cd 8723du
          make ARCH=arm \
               CROSS_COMPILE=arm-linux-gnueabihf- \
               KSRC=$GITHUB_WORKSPACE/linux-3.18.24 \
               KCFLAGS="-march=armv7-a -Wno-error -Wno-misleading-indentation -Wno-int-in-bool-context" \
               modules -j$(nproc) 2>&1 | tee ../build.log
          exit ${PIPESTATUS[0]}

      - name: Strip module
        run: |
          cd 8723du
          if [ -f 8723du.ko ]; then
            echo "before: $(stat -c%s 8723du.ko) bytes"
            arm-linux-gnueabihf-strip --strip-debug 8723du.ko
            echo "after : $(stat -c%s 8723du.ko) bytes"
            echo "--- vermagic after strip ---"
            strings 8723du.ko | grep -m1 "^vermagic=" || echo "WARNING: vermagic lost!"
          else
            echo "no .ko produced, skipping strip"
          fi

      - name: Inspect result
        if: always()
        run: |
          echo "=== ko files ==="
          find . -name "*.ko" -exec ls -lh {} \; || echo "no .ko produced"
          echo
          echo "=== vermagic ==="
          for f in $(find . -name "*.ko"); do
            echo "$f:"
            strings "$f" | grep -m1 "^vermagic=" || echo "  (no vermagic found)"
          done
          echo
          echo "=== last 80 lines of build log ==="
          tail -80 build.log 2>/dev/null || echo "(no log)"

      - name: Fail if no module produced
        if: always()
        run: |
          if ! ls 8723du/*.ko >/dev/null 2>&1; then
            echo "::error::Compilation produced no .ko file. See build log above."
            exit 1
          fi

      - name: Upload module
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 8723du-build-result
          path: |
            8723du/*.ko
            build.log
          if-no-files-found: warn
          retention-days: 14
